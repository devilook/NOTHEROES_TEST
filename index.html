<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НЕ ГЕРОИ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: слева поле боя, справа «стол»: колесо инициативы, лоток кубиков, панель хода. На узком экране всё в одну колонку. */
:root {
  --bg: #e6e8e3;
  --surface: #f6f7f3;
  --board: #fbfbf8;
  --grid: #dadfd5;
  --ink: #1e231f;
  --muted: #677067;
  --line: #ccd2c8;
  --wall: #2f3532;
  --half: #6f8796;
  --tok: #8a7350;
  --tok-bg: #f1ead9;
  --felt: #2f4a3c;
  --felt-ink: #e9efe9;
  --good: #2b8a3e;
  --bad: #868e96;
  --f1: #e3a500; --f1i: #2b2000;
  --f2: #2f9e44; --f2i: #ffffff;
  --f3: #e03131; --f3i: #ffffff;
  --f4: #1c7ed6; --f4i: #ffffff;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1e1b; --board: #1e2320; --grid: #2c332e; --ink: #e5e9e3; --muted: #939b92;
    --line: #313932; --wall: #d5dbd4; --half: #7fa0b3; --tok: #d2b98b; --tok-bg: #3a3326; --felt: #20352a; --felt-ink: #e3ebe4;
    --good: #69db7c; --bad: #868e96;
    --f1: #ffd43b; --f1i: #2b2000; --f2: #51cf66; --f2i: #0a2010; --f3: #ff6b6b; --f3i: #2a0707; --f4: #4dabf7; --f4i: #06192b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1e1b; --board: #1e2320; --grid: #2c332e; --ink: #e5e9e3; --muted: #939b92;
  --line: #313932; --wall: #d5dbd4; --half: #7fa0b3; --tok: #d2b98b; --tok-bg: #3a3326; --felt: #20352a; --felt-ink: #e3ebe4;
  --good: #69db7c; --bad: #868e96;
  --f1: #ffd43b; --f1i: #2b2000; --f2: #51cf66; --f2i: #0a2010; --f3: #ff6b6b; --f3i: #2a0707; --f4: #4dabf7; --f4i: #06192b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
}
.f1 { --fc: var(--f1); --fi: var(--f1i); } .f2 { --fc: var(--f2); --fi: var(--f2i); }
.f3 { --fc: var(--f3); --fi: var(--f3i); } .f4 { --fc: var(--f4); --fi: var(--f4i); }

header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
h1 { font: 800 22px/1 var(--f-display); letter-spacing: .02em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.phase {
  margin-left: auto; font: 500 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em;
  padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
}
.phase[class*=" f"] { border-color: var(--fc); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 12px; min-width: 0; }

.board-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; display: grid; gap: 6px; }
#board { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); touch-action: manipulation; user-select: none; cursor: pointer; }
#board-info { min-height: 1.5em; padding: 0 6px; color: var(--muted); font-size: 13px; }
#board-info b { color: var(--ink); }

/* Карта */
.floor { fill: var(--board); }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.zone { fill: var(--fc); fill-opacity: .16; }
.zone.empty { fill: var(--line); fill-opacity: .35; }
.zone-num { fill: var(--fc); fill-opacity: .35; font: 800 54px var(--f-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.zone-num.empty { fill: var(--muted); fill-opacity: .2; }
.coord { fill: var(--muted); font: 500 10px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.coord.row { text-anchor: end; }
.block { fill: var(--wall); fill-opacity: .3; }
.wall { stroke: var(--wall); stroke-width: 5; stroke-linecap: square; fill: none; }
.half { stroke: var(--half); stroke-width: 4; stroke-dasharray: 6 4; stroke-linecap: butt; fill: none; }
.map-token rect { fill: var(--tok-bg); stroke: var(--tok); stroke-width: 1.5; }
.map-token text { fill: var(--tok); font: 700 13px var(--f-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

/* Подсветки */
.place-target { fill: none; stroke: var(--fc); stroke-width: 2; stroke-dasharray: 4 3; }
.reach { fill: var(--fc); fill-opacity: .2; }
.reach-num { fill: var(--muted); font: 500 8px var(--f-mono); text-anchor: end; pointer-events: none; }
.path { fill: none; stroke: var(--fc); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.path-dot { fill: var(--fc); }
.path-end { fill: var(--board); stroke: var(--fc); stroke-width: 3; }
.path-label { fill: var(--ink); font: 700 11px var(--f-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.hover { fill: none; stroke: var(--ink); stroke-opacity: .45; stroke-width: 1.5; pointer-events: none; }
.target circle { fill: none; stroke: var(--ink); stroke-width: 2; }
.target path { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.target { animation: aim 1.2s ease-in-out infinite; }
@keyframes aim { 50% { opacity: .45; } }

/* Фишки */
.unit { pointer-events: none; }
.token { fill: var(--fc); stroke: var(--board); stroke-width: 2.5; }
.token-label { fill: var(--fi); font: 700 13px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.active-ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hp-bg { fill: var(--line); }
.hp { fill: var(--good); }
.hp.low { fill: var(--f3); }

/* Колесо */
.wheel-card { background: var(--felt); color: var(--felt-ink); border-radius: 12px; padding: 10px; }
#wheel { display: block; width: 100%; max-width: 340px; margin: 0 auto; height: auto; user-select: none; }
.w-face { fill: none; stroke: var(--felt-ink); stroke-opacity: .12; stroke-width: 1; }
.w-track { fill: none; stroke: var(--felt-ink); stroke-opacity: .25; stroke-width: 1; }
.w-border { stroke: var(--felt-ink); stroke-width: 3; }
.w-hand { stroke: var(--felt-ink); stroke-width: 3; stroke-linecap: round; opacity: .9; }
.w-hub { fill: var(--felt-ink); }
.w-num { fill: var(--felt-ink); fill-opacity: .55; font: 500 9px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.w-num.cur { fill-opacity: 1; font-weight: 700; }
.w-empty { fill: var(--felt-ink); fill-opacity: .3; }
.w-token { fill: var(--fc); stroke: var(--felt); stroke-width: 2; }
.w-slot.hero .w-token { stroke: var(--felt-ink); stroke-dasharray: 3 2; }
.w-label { fill: var(--fi); font: 700 11px var(--f-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.w-current { fill: none; stroke: var(--felt-ink); stroke-width: 2.5; }
.w-slot.option { cursor: pointer; }
.w-slot.option .w-empty { fill: var(--felt-ink); fill-opacity: .9; }
.w-opt-label { fill: var(--felt); font: 700 10px var(--f-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.w-slot.option.hover .w-empty { fill: #fff; }
.w-hit { fill: transparent; }
.w-title { fill: var(--felt-ink); font: 700 15px var(--f-display); text-anchor: middle; }
.w-sub { fill: var(--felt-ink); fill-opacity: .7; font: 500 11px var(--f-body); text-anchor: middle; }

/* Лоток кубиков */
.tray { background: var(--felt); color: var(--felt-ink); border-radius: 12px; padding: 12px; min-height: 150px; display: grid; gap: 10px; align-content: start; }
.tray h2 { color: var(--felt-ink); opacity: .7; }
.dice-row { display: flex; flex-wrap: wrap; gap: 14px; }
.die-slot { margin: 0; display: grid; justify-items: center; gap: 6px; width: 76px; text-align: center; }
.die {
  width: 50px; height: 50px; display: grid; place-items: center;
  background: var(--fc, #f5f5f0); color: var(--fi, #1e231f);
  border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.18);
}
.die.d30 { border-radius: 4px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); box-shadow: none; }
.die .num { font: 700 20px var(--f-mono); }
.pips { width: 36px; height: 36px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); place-items: center; }
.pips i { width: 8px; height: 8px; border-radius: 50%; }
.pips i.on { background: var(--fi, #1e231f); }
.die.rolling { animation: tumble .25s linear infinite; }
.die.landed { animation: land .35s ease-out; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(20deg) translateY(-6px); } 100% { transform: rotate(-10deg) translateY(0); } }
@keyframes land { 0% { transform: scale(1.25); } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
.die-slot figcaption { display: grid; gap: 2px; font-size: 11px; line-height: 1.25; }
.die-slot .cap { opacity: .75; }
.die-slot .note { font: 500 11px var(--f-mono); }
.die-slot.bad .die { opacity: .5; }
.dice-summary { font-size: 13px; line-height: 1.5; }
.dice-summary b { font-weight: 600; }
.dice-summary .chip-text { color: inherit; border-bottom: 2px solid var(--fc); }

/* Панель */
#panel { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.quiet { background: none; border: 0; padding: 0; }
.turn-card { border-left: 4px solid var(--fc); }
h2 { margin: 0; font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.state { margin: 0; font-size: 13px; }
.warn { margin: 0; color: var(--f3); font-size: 13px; }
ul, ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.chip {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: var(--fc); color: var(--fi); font: 700 12px var(--f-mono);
}
.chip-text { color: var(--ink); border-bottom: 2px solid var(--fc); }
.who { display: flex; gap: 10px; align-items: center; }
.who > div { flex: 1; min-width: 0; }
.who strong { display: block; font-size: 15px; }
.who small { display: block; color: var(--muted); font-size: 12px; }
.who.big .chip { width: 36px; height: 36px; font-size: 16px; }
.who.big strong { font: 600 16px/1.2 var(--f-display); }
.hpbar { width: 60px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.hpbar b { display: block; height: 100%; background: var(--good); }
.hp-num { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }

.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { display: grid; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; border-left: 4px solid var(--fc, var(--line)); }
.zone-tag { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--board); color: var(--ink); font: inherit; }
.seat-list li { display: flex; align-items: center; gap: 8px; }
.seat-list li.out { opacity: .45; text-decoration: line-through; }
.seat-list .ord { font: 500 11px var(--f-mono); color: var(--muted); width: 1em; }
.seat-list .s-name { flex: 1; min-width: 0; }
.s-stat { font: 500 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.slot-picks { display: flex; flex-wrap: wrap; gap: 6px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--board);
  color: var(--ink); font: 600 13px var(--f-body); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { background: none; color: var(--muted); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.mini {
  min-width: 34px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--board); color: var(--ink);
  font: 500 12px var(--f-mono); cursor: pointer;
}
.mini.strong { border-color: var(--ink); font-weight: 700; }
.mini:hover { border-color: var(--ink); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.win { border-left: 4px solid var(--fc, var(--line)); }
.win-title { margin: 0; font: 800 22px/1.2 var(--f-display); }

.log { font-size: 12px; max-height: 260px; overflow: auto; }
.log li { display: flex; gap: 8px; padding: 2px 0 2px 8px; border-left: 3px solid var(--fc, var(--line)); }
.log span { font: 500 10px var(--f-mono); color: var(--muted); padding-top: 2px; flex: none; }

.toast { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  .target, .active-ring, .die.rolling, .die.landed { animation: none; }
}
</style>
</head>
<body>
<header>
  <h1>НЕ ГЕРОИ</h1>
  <span class="sub">прототип: колесо инициативы, движение, бой · тестовые юниты</span>
  <span id="phase" class="phase">Подготовка</span>
</header>
<div class="layout">
  <div class="board-wrap">
    <svg id="board" role="img" aria-label="Игровое поле"></svg>
    <div id="board-info" aria-live="polite"></div>
  </div>
  <div class="side">
    <div class="wheel-card"><svg id="wheel" role="img" aria-label="Колесо инициативы"></svg></div>
    <div id="tray" class="tray" aria-live="polite">
      <h2>Кубики</h2>
      <div class="dice-row"></div>
      <div class="dice-summary"></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<script src="src/map.js"></script>
<script src="src/engine.js"></script>
<script src="src/dice.js"></script>
<script src="src/wheel.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
